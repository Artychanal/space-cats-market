spring:
  application:
    name: cosmo-cats
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cosmo_cats}
    username: ${DB_USERNAME:cosmo}
    password: ${DB_PASSWORD:cosmo}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml
logging:
  level:
    root: INFO
    com.artur.java.spacecatsmarket: DEBUG
  pattern.console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
clients:
  rates:
    base-url: http://localhost:8089/api/v1
    connect-timeout-ms: 1000
    read-timeout-ms: 1500
feature:
  cosmo-cats-enabled: true
  kitty-products-enabled: false
